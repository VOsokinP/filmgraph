[project]
name = "filmgraph-backend"
version = "0.1.0"
description = "FilmGraph movie catalog API (FastAPI + MySQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "sqlalchemy",
    "pymysql",
    "pydantic-settings",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt<5",
    "itsdangerous",
    "httpx",
    "alembic",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
etl = [
    "lxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
