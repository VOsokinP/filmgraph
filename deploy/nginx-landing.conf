server {
    server_name vosokin.dev www.vosokin.dev;

    root /var/www/landing;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vosokin.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vosokin.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = vosokin.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.vosokin.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name vosokin.dev www.vosokin.dev;
    return 404; # managed by Certbot
}
